[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-all"
version = "0.1.0.dev0"
description = "Function-aware optimization across major LLM matrix families"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
data = [
  "datasets>=3,<5",
  "transformers>=4.56,<5",
]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
